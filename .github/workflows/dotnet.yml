name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

  build_and_publish:
    needs: create_release
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            output: volatility_win-x64_release
            zipName: Volatility_win-x64_Release.zip
          - rid: win-arm64
            output: volatility_win-arm64_release
            zipName: Volatility_win-arm64_Release.zip
          - rid: linux-x64
            output: volatility_linux-x64_release
            zipName: Volatility_linux-x64_Release.zip
          - rid: linux-arm64
            output: volatility_linux-arm64_release
            zipName: Volatility_linux-arm64_Release.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore src/Volatility.Cli/Volatility.Cli.csproj

      - name: Fetch latest DXC
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rid = '${{ matrix.rid }}'
          if ($rid -notlike 'win-*' -and $rid -ne 'linux-x64') {
            Write-Host "No official DXC asset for RID $rid; skipping."
            exit 0
          }

          $projectDir = Join-Path $PWD 'src/Volatility.Cli'
          $toolsDir = Join-Path $projectDir 'tools'
          $dxcDir = Join-Path $toolsDir 'dxc'
          New-Item -ItemType Directory -Force -Path $dxcDir | Out-Null

          # Authenticated requests avoid the shared 60/hour unauthenticated limit on runner IPs.
          $headers = @{
            'User-Agent' = 'volatility-ci'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/latest" -Headers $headers

          $extract = Join-Path $env:TEMP "dxc_extract_$rid"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          $dest = Join-Path $dxcDir $rid
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          if ($rid -like 'win-*') {
            $asset = $release.assets | Where-Object { $_.name -like 'dxc_*.zip' } | Select-Object -First 1
            if (-not $asset) { throw "DXC zip asset not found." }
            $zip = Join-Path $env:TEMP $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $extract
          }
          else {
            # Asset naming has varied between x86_64 and x86_x64.
            $asset = $release.assets | Where-Object { $_.name -match '^linux_dxc_.*x86_(64|x64).*\.tar\.gz$' } | Select-Object -First 1
            if (-not $asset) { throw "DXC linux asset not found." }
            $tar = Join-Path $env:TEMP $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tar
            tar -xzf $tar -C $extract
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract $($asset.name)." }
          }

          # Some archives nest everything under a single top-level directory.
          $root = $extract
          if (-not (Test-Path (Join-Path $root 'bin'))) {
            $root = (Get-ChildItem -Path $extract -Directory | Select-Object -First 1).FullName
          }
          if (-not $root -or -not (Test-Path (Join-Path $root 'bin'))) { throw "DXC bin directory not found in $($asset.name)." }

          if ($rid -like 'win-*') {
            $arch = $rid -eq 'win-arm64' ? 'arm64' : 'x64'
            Copy-Item -Path (Join-Path $root "bin/$arch/*") -Destination $dest -Recurse -Force
          }
          else {
            Copy-Item -Path (Join-Path $root 'bin/dxc') -Destination $dest -Force
            Copy-Item -Path (Join-Path $root 'lib/libdxcompiler.so') -Destination $dest -Force
            Copy-Item -Path (Join-Path $root 'lib/libdxil.so') -Destination $dest -Force
          }

          # License spelling (LICENSE/LICENCE) and release notes presence vary between releases.
          Get-ChildItem -Path $root -File | Where-Object { $_.Name -like 'LICEN?E-*.txt' -or $_.Name -eq 'ReleaseNotes.md' } |
            Copy-Item -Destination $dxcDir -Force

      - name: Publish for ${{ matrix.rid }}
        shell: pwsh
        run: dotnet publish --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:ApplicationIcon=../Volatility.Cli/volatility_icon.ico --output ${{ matrix.output }} src/Volatility.Cli/Volatility.Cli.csproj

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.output }}/* -DestinationPath ${{ matrix.zipName }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ matrix.zipName }}
          asset_name: ${{ matrix.zipName }}
          asset_content_type: application/zip

  build_macos_universal:
    needs: create_release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore src/Volatility.Cli/Volatility.Cli.csproj

      - name: Publish macOS x64
        run: dotnet publish --configuration Release --runtime osx-x64 --self-contained true -p:ApplicationIcon=../Volatility.Cli/volatility_icon.ico --output ./volatility_macos-x64_release src/Volatility.Cli/Volatility.Cli.csproj

      - name: Publish macOS arm64
        run: dotnet publish --configuration Release --runtime osx-arm64 --self-contained true -p:ApplicationIcon=../Volatility.Cli/volatility_icon.ico --output ./volatility_macos-arm64_release src/Volatility.Cli/Volatility.Cli.csproj

      - name: Zip macOS universal bundle
        run: zip -r Volatility_macos-universal_Release.zip volatility_macos-x64_release volatility_macos-arm64_release

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./Volatility_macos-universal_Release.zip
          asset_name: Volatility_macos-universal_Release.zip
          asset_content_type: application/zip

  notify_discord:
    needs:
      - create_release
      - build_and_publish
      - build_macos_universal
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"New release created: v${{ github.run_number }}. See https://github.com/${{ github.repository }}/releases/tag/v${{ github.run_number }}\"}" \
               "${{ secrets.WEBHOOK_LINK }}"
